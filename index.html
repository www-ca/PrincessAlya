<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystical Realm — For Alya</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        mystic: {
                            950: '#080114',
                            900: '#120524',
                            800: '#2a0845',
                            700: '#4a126b',
                            600: '#7b1fa2',
                            500: '#aa00ff',
                            400: '#d500f9',
                            300: '#e040fb',
                            200: '#ea80fc',
                            100: '#f3e8ff',
                        },
                        spiderRed: {
                            500: '#ff003c',
                            600: '#d50032',
                            700: '#990022',
                        }
                    },
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #06010e;
            color: #f3e8ff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            perspective: 1000px;
        }
        .font-cinzel {
            font-family: 'Cinzel', serif;
        }

        /* Animated Red Spider Lily Background GIF with Dual Purple-Crimson Gradient Blend */
        .bg-spider-lily-gif {
            background-image: 
                radial-gradient(circle at center, rgba(170, 0, 255, 0.25) 0%, rgba(6, 1, 14, 0.85) 100%),
                linear-gradient(to bottom, rgba(12, 2, 24, 0.75), rgba(6, 1, 14, 0.9)), 
                url('https://i.pinimg.com/originals/d1/96/46/d196463938585dde9b86bffc6cf27ee5.gif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: contrast(1.15) brightness(0.9) saturate(1.2);
            transition: transform 0.15s ease-out;
        }

        /* Dual-tone neon text glow */
        .neon-glow-dual {
            text-shadow: 
                0 0 10px rgba(224, 64, 251, 0.9), 
                0 0 25px rgba(255, 0, 60, 0.8), 
                0 0 50px rgba(170, 0, 255, 0.6);
        }

        .neon-box-glow {
            box-shadow: 
                0 0 45px rgba(170, 0, 255, 0.35), 
                0 0 25px rgba(255, 0, 60, 0.3), 
                inset 0 0 30px rgba(224, 64, 251, 0.2);
        }

        .glass-panel {
            background: rgba(18, 5, 36, 0.72);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(224, 64, 251, 0.35);
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-14px) rotate(2deg); }
        }
        .animate-float {
            animation: floatSlow 5.5s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 20px rgba(224, 64, 251, 0.8)); }
            50% { opacity: 1; filter: drop-shadow(0 0 45px rgba(255, 0, 60, 0.95)); }
        }
        .animate-pulse-glow {
            animation: pulseGlow 2.8s ease-in-out infinite;
        }

        /* Canvas overlays */
        #particleCanvas, #rippleCanvas, #cursorCanvas {
            pointer-events: none;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #06010e;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a0845;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #aa00ff;
        }
    </style>
</head>
<body class="min-h-screen relative flex flex-col items-center justify-center selection:bg-fuchsia-600 selection:text-white overflow-hidden" onmousemove="handleMouseMove(event)">

    <!-- Background GIF Layer with Parallax Movement -->
    <div id="bgLayer" class="fixed -inset-10 bg-spider-lily-gif pointer-events-none z-0 scale-105"></div>
    <div class="fixed inset-0 bg-gradient-to-t from-[#06010e] via-transparent to-purple-950/30 pointer-events-none z-0"></div>

    <!-- Floating Red & Purple Spider Lily Petal Canvas -->
    <canvas id="particleCanvas" class="fixed inset-0 z-10"></canvas>

    <!-- Cursor Light & Trail Canvas -->
    <canvas id="cursorCanvas" class="fixed inset-0 z-15"></canvas>
    
    <!-- Click Wave Ripple Canvas -->
    <canvas id="rippleCanvas" class="fixed inset-0 z-20"></canvas>

    <!-- Header Controls -->
    <header class="absolute top-6 right-6 z-40 flex items-center gap-3">
        <button id="soundToggleBtn" onclick="toggleSound()" class="glass-panel px-4 py-2 rounded-full text-xs font-semibold tracking-wider text-purple-200 hover:text-white hover:bg-purple-900/60 transition-all duration-300 flex items-center gap-2 shadow-lg group border border-purple-400/30">
            <span id="soundIcon" class="text-purple-300 group-hover:scale-110 transition-transform">🔊</span>
            <span id="soundText">Sound: ON</span>
        </button>
        <button onclick="replayIntro()" class="glass-panel px-4 py-2 rounded-full text-xs font-semibold tracking-wider text-purple-200 hover:text-white hover:bg-purple-900/60 transition-all duration-300 flex items-center gap-2 shadow-lg group border border-purple-400/30">
            <span class="group-hover:rotate-180 transition-transform duration-500">🔄</span>
            <span>Replay Intro</span>
        </button>
    </header>

    <!-- Main Container -->
    <main class="relative z-30 w-full max-w-4xl px-4 py-10 flex flex-col items-center text-center">
        
        <!-- Glassmorphism Card -->
        <div id="introCard" class="glass-panel w-full rounded-3xl p-8 sm:p-12 neon-box-glow transition-transform duration-300 ease-out flex flex-col items-center relative overflow-hidden shadow-2xl border border-fuchsia-500/30">
            
            <!-- Ambient glowing blur spheres -->
            <div class="absolute -top-20 -left-20 w-56 h-56 bg-purple-600/25 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-20 -right-20 w-56 h-56 bg-rose-600/25 rounded-full blur-3xl pointer-events-none"></div>

            <!-- Step 1: SLOGAN.png Logo Reveal -->
            <div id="logoContainer" class="mb-8 transition-all duration-1000 transform opacity-0 scale-75">
                <div class="relative inline-block group">
                    <div class="absolute inset-0 bg-gradient-to-r from-purple-600 via-rose-500 to-fuchsia-600 rounded-2xl blur-xl opacity-80 animate-pulse-glow"></div>
                    <div class="relative w-28 h-28 sm:w-36 sm:h-36 rounded-2xl glass-panel p-3 flex items-center justify-center border border-purple-300/40 animate-float shadow-2xl">
                        <!-- Logo with graceful fallback -->
                        <img id="logoImg" src="SLOGAN.png" alt="SLOGAN Logo" class="w-full h-full object-contain drop-shadow-[0_0_18px_rgba(224,64,251,0.9)]" onerror="handleLogoError(this)">
                    </div>
                </div>
            </div>

            <!-- Step 2: MXM Cyber Scrambler Text -->
            <div class="mb-6 min-h-[4.5rem] sm:min-h-[5.5rem] flex items-center justify-center cursor-pointer" onclick="triggerMatrixPulse('mxmText')">
                <h1 id="mxmText" class="font-cinzel text-6xl sm:text-8xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-purple-100 via-fuchsia-200 to-rose-200 neon-glow-dual opacity-0 transition-opacity duration-500 hover:scale-105 transform transition-transform">
                    <!-- Dynamic Matrix Text -->
                </h1>
            </div>

            <!-- Animated Divider -->
            <div id="dividerLine" class="w-32 h-[2px] bg-gradient-to-r from-transparent via-fuchsia-400 to-transparent my-3 opacity-0 transition-all duration-700"></div>

            <!-- Step 3: Princess Alya Greeting Text -->
            <div class="mb-10 min-h-[3.5rem] flex items-center justify-center max-w-2xl px-2">
                <p id="subtitleText" class="font-sans text-lg sm:text-2xl font-light tracking-wide text-purple-100/95 opacity-0 transition-opacity duration-500 leading-relaxed drop-shadow-[0_2px_14px_rgba(255,0,60,0.7)]">
                    <!-- Dynamic Subtitle Text -->
                </p>
            </div>

            <!-- Step 4: Final Interactive Reveal Button -->
            <div id="actionContainer" class="opacity-0 translate-y-6 transition-all duration-700">
                <button onclick="enterRealm()" class="relative group overflow-hidden rounded-full p-[2px] focus:outline-none shadow-[0_0_35px_rgba(255,0,60,0.6)] transition-all duration-300 transform hover:scale-105">
                    <span class="absolute inset-0 bg-gradient-to-r from-purple-600 via-fuchsia-500 to-rose-600 rounded-full animate-pulse"></span>
                    <span class="relative px-8 py-4 rounded-full bg-[#0c031a] text-purple-100 font-cinzel tracking-wider text-base sm:text-lg font-bold flex items-center gap-3 transition-all duration-300 group-hover:bg-opacity-80 group-hover:text-white">
                        <span>Enter for some questions :)</span>
                        <span class="transform group-hover:translate-x-1.5 transition-transform text-rose-400">🌺</span>
                    </span>
                </button>
            </div>

        </div>

        <!-- Footer -->
        <footer class="mt-8 text-xs text-purple-300/70 font-medium tracking-widest uppercase drop-shadow-md flex items-center gap-2">
            <span>Created for the one and only Princess Alya</span>
            <span class="text-rose-500">❖</span>
            <span>or in otherwords lily</span>
        </footer>
    </main>

    <!-- Custom Modal -->
    <div id="customModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="glass-panel max-w-md w-full rounded-2xl p-6 sm:p-8 text-center border border-fuchsia-500/40 shadow-[0_0_60px_rgba(255,0,60,0.5)] transform scale-95 transition-transform duration-300" id="modalBoxContent">
            <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-purple-900/60 flex items-center justify-center text-3xl border border-fuchsia-400/40 shadow-[0_0_25px_rgba(224,64,251,0.8)]">
                🌺
            </div>
            <h3 id="modalTitle" class="font-cinzel text-2xl font-bold text-purple-100 mb-2">Welcome Princess Alya</h3>
            <p id="modalMessage" class="text-purple-200 text-sm sm:text-base mb-6 leading-relaxed">The crimson red spider lilies bloom under deep dark violet skies just for you. Welcome!</p>
            <button onclick="goToQuestions()" class="w-full py-3 rounded-xl bg-gradient-to-r from-purple-600 via-fuchsia-600 to-rose-600 text-white font-semibold font-cinzel tracking-wider hover:opacity-90 transition-opacity shadow-lg">
                Continue
            </button>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // --- Parallax & Interactive Cursor Light Trail ---
        const cursorCanvas = document.getElementById('cursorCanvas');
        const cCtx = cursorCanvas.getContext('2d');
        let cursorTrail = [];
        let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;

        function resizeCursorCanvas() {
            cursorCanvas.width = window.innerWidth;
            cursorCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCursorCanvas);
        resizeCursorCanvas();

        function handleMouseMove(e) {
            mouseX = e.clientX;
            mouseY = e.clientY;

            // Parallax movement
            const x = (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
            const y = (e.clientY - window.innerHeight / 2) / (window.innerHeight / 2);

            const bg = document.getElementById('bgLayer');
            bg.style.transform = `scale(1.08) translate(${x * -20}px, ${y * -20}px)`;

            const card = document.getElementById('introCard');
            card.style.transform = `rotateY(${x * 7}deg) rotateX(${y * -7}deg)`;

            // Add glow particle to mouse trail
            cursorTrail.push({
                x: mouseX,
                y: mouseY,
                size: Math.random() * 8 + 4,
                alpha: 1,
                color: Math.random() > 0.5 ? '#ff003c' : '#ea80fc'
            });
        }

        function animateCursorTrail() {
            cCtx.clearRect(0, 0, cursorCanvas.width, cursorCanvas.height);

            // Ambient cursor light glow
            const grad = cCtx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 180);
            grad.addColorStop(0, 'rgba(234, 128, 252, 0.15)');
            grad.addColorStop(0.5, 'rgba(255, 0, 60, 0.08)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            cCtx.fillStyle = grad;
            cCtx.beginPath();
            cCtx.arc(mouseX, mouseY, 180, 0, Math.PI * 2);
            cCtx.fill();

            // Trail particles update
            for (let i = cursorTrail.length - 1; i >= 0; i--) {
                const p = cursorTrail[i];
                p.alpha -= 0.03;
                p.size *= 0.95;
                if (p.alpha <= 0) {
                    cursorTrail.splice(i, 1);
                    continue;
                }
                cCtx.save();
                cCtx.globalAlpha = p.alpha;
                cCtx.fillStyle = p.color;
                cCtx.shadowColor = p.color;
                cCtx.shadowBlur = 12;
                cCtx.beginPath();
                cCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                cCtx.fill();
                cCtx.restore();
            }

            requestAnimationFrame(animateCursorTrail);
        }
        animateCursorTrail();

        // --- Interactive Click Ripples ---
        const rippleCanvas = document.getElementById('rippleCanvas');
        const rCtx = rippleCanvas.getContext('2d');
        let ripples = [];

        function resizeRippleCanvas() {
            rippleCanvas.width = window.innerWidth;
            rippleCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeRippleCanvas);
        resizeRippleCanvas();

        window.addEventListener('click', (e) => {
            ripples.push({
                x: e.clientX,
                y: e.clientY,
                radius: 5,
                maxRadius: 90,
                alpha: 0.85,
                color: Math.random() > 0.5 ? '#ff003c' : '#d500f9'
            });
            playChimeNote(580 + Math.random() * 320);
        });

        function animateRipples() {
            rCtx.clearRect(0, 0, rippleCanvas.width, rippleCanvas.height);
            for (let i = ripples.length - 1; i >= 0; i--) {
                const r = ripples[i];
                r.radius += 3;
                r.alpha -= 0.025;
                if (r.alpha <= 0 || r.radius >= r.maxRadius) {
                    ripples.splice(i, 1);
                    continue;
                }
                rCtx.save();
                rCtx.beginPath();
                rCtx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                rCtx.strokeStyle = r.color;
                rCtx.globalAlpha = r.alpha;
                rCtx.lineWidth = 2.5;
                rCtx.shadowColor = '#ea80fc';
                rCtx.shadowBlur = 12;
                rCtx.stroke();
                rCtx.restore();
            }
            requestAnimationFrame(animateRipples);
        }
        animateRipples();

        // --- Ambient Synthesizer Audio Engine ---
        let audioCtx = null;
        let isSoundEnabled = true;
        let ambientOsc1 = null, ambientOsc2 = null, ambientGain = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function toggleSound() {
            isSoundEnabled = !isSoundEnabled;
            const icon = document.getElementById('soundIcon');
            const text = document.getElementById('soundText');
            if (isSoundEnabled) {
                icon.textContent = '🔊';
                text.textContent = 'Sound: ON';
                initAudio();
                startAmbientHum();
            } else {
                icon.textContent = '🔇';
                text.textContent = 'Sound: OFF';
                stopAmbientHum();
            }
        }

        function startAmbientHum() {
            if (!isSoundEnabled || !audioCtx) return;
            try {
                if (ambientGain) stopAmbientHum();
                
                ambientOsc1 = audioCtx.createOscillator();
                ambientOsc2 = audioCtx.createOscillator();
                ambientGain = audioCtx.createGain();

                ambientOsc1.type = 'sine';
                ambientOsc1.frequency.setValueAtTime(108, audioCtx.currentTime); 
                ambientOsc2.type = 'triangle';
                ambientOsc2.frequency.setValueAtTime(162, audioCtx.currentTime); 

                ambientGain.gain.setValueAtTime(0.02, audioCtx.currentTime);

                ambientOsc1.connect(ambientGain);
                ambientOsc2.connect(ambientGain);
                ambientGain.connect(audioCtx.destination);

                ambientOsc1.start();
                ambientOsc2.start();
            } catch (e) {
                console.log("Audio play restrained:", e);
            }
        }

        function stopAmbientHum() {
            if (ambientOsc1) { try { ambientOsc1.stop(); ambientOsc1.disconnect(); } catch(e){} ambientOsc1 = null; }
            if (ambientOsc2) { try { ambientOsc2.stop(); ambientOsc2.disconnect(); } catch(e){} ambientOsc2 = null; }
            if (ambientGain) { try { ambientGain.disconnect(); } catch(e){} ambientGain = null; }
        }

        function playChimeNote(freq = 440) {
            if (!isSoundEnabled || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.55);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.55);
            } catch(e){}
        }

        // --- Logo Fallback SVG ---
        function handleLogoError(imgElement) {
            const parent = imgElement.parentElement;
            parent.innerHTML = `
                <svg viewBox="0 0 100 100" class="w-full h-full text-purple-200 drop-shadow-[0_0_20px_rgba(255,0,60,0.95)]" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="50" cy="50" r="42" stroke="url(#logoGrad)" stroke-width="3" />
                    <path d="M50 15 C50 35, 35 50, 15 50 C35 50, 50 65, 50 85 C50 65, 65 50, 85 50 C65 50, 50 35, 50 15 Z" fill="url(#lilyGrad)" opacity="0.95" />
                    <circle cx="50" cy="50" r="7" fill="#ff003c" />
                    <defs>
                        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ea80fc" />
                            <stop offset="50%" stop-color="#ff003c" />
                            <stop offset="100%" stop-color="#aa00ff" />
                        </linearGradient>
                        <linearGradient id="lilyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#aa00ff" />
                            <stop offset="50%" stop-color="#ff003c" />
                            <stop offset="100%" stop-color="#d50032" />
                        </linearGradient>
                    </defs>
                </svg>
            `;
        }

        // --- Falling Red & Purple Spider Lily Petal Physics Engine ---
        const particleCanvas = document.getElementById('particleCanvas');
        const ctx = particleCanvas.getContext('2d');
        let width, height;
        let particles = [];
        let petals = [];

        function resizeParticleCanvas() {
            width = particleCanvas.width = window.innerWidth;
            height = particleCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeParticleCanvas);
        resizeParticleCanvas();

        class GlowParticle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2.2 + 0.5;
                this.alpha = Math.random() * 0.7 + 0.2;
                this.twinkleSpeed = Math.random() * 0.02 + 0.005;
            }
            update() {
                this.alpha += Math.sin(Date.now() * this.twinkleSpeed) * 0.01;
                if (this.alpha < 0.1) this.alpha = 0.1;
                if (this.alpha > 1) this.alpha = 1;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = '#ea80fc';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class FallingPetal {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width;
                this.y = -40;
                this.size = Math.random() * 20 + 10;
                this.speedY = Math.random() * 1.1 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.8;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.03;
                const petalColors = ['#ff003c', '#d50032', '#aa00ff', '#e040fb', '#ff1744'];
                this.color = petalColors[Math.floor(Math.random() * petalColors.length)];
                this.opacity = Math.random() * 0.75 + 0.25;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.y * 0.007) * 0.7;
                this.rotation += this.rotationSpeed;
                if (this.y > height + 40) { this.reset(); }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 15;

                // Long curved Spider Lily petal silhouette
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(this.size * 0.7, -this.size * 0.4, 0, -this.size);
                ctx.quadraticCurveTo(-this.size * 0.7, -this.size * 0.4, 0, 0);
                ctx.fill();

                ctx.restore();
            }
        }

        function initScene() {
            particles = [];
            petals = [];
            for (let i = 0; i < 110; i++) particles.push(new GlowParticle());
            for (let i = 0; i < 35; i++) petals.push(new FallingPetal());
        }
        initScene();

        function animateScene() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => { p.update(); p.draw(); });
            petals.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateScene);
        }
        animateScene();

        // --- Matrix Cyber Text Scrambler Animation ---
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%&*~!?()[]{}+-=";

        function scrambleText(elementId, targetString, speed = 40, onComplete = null) {
            const el = document.getElementById(elementId);
            el.style.opacity = '1';
            let iteration = 0;
            
            const interval = setInterval(() => {
                el.innerText = targetString
                    .split("")
                    .map((char, index) => {
                        if (char === " " || char === "(" || char === ")" || char === ":" || char === "-") return char;
                        if (index < iteration) {
                            return targetString[index];
                        }
                        return chars[Math.floor(Math.random() * chars.length)];
                    })
                    .join("");

                if (iteration % 2 === 0) {
                    playChimeNote(380 + (iteration * 32));
                }

                if (iteration >= targetString.length) {
                    clearInterval(interval);
                    el.innerText = targetString;
                    if (onComplete) onComplete();
                }
                
                iteration += 1/3;
            }, speed);
        }

        function triggerMatrixPulse(elementId) {
            if (elementId === 'mxmText') {
                scrambleText('mxmText', 'MXM', 40);
            }
        }

        // --- Sequence Orchestration ---
        function runIntroSequence() {
            document.getElementById('logoContainer').className = "mb-8 transition-all duration-1000 transform opacity-0 scale-75";
            document.getElementById('mxmText').innerText = "";
            document.getElementById('mxmText').style.opacity = '0';
            document.getElementById('dividerLine').style.opacity = '0';
            document.getElementById('dividerLine').style.width = '0px';
            document.getElementById('subtitleText').innerText = "";
            document.getElementById('subtitleText').style.opacity = '0';
            document.getElementById('actionContainer').className = "opacity-0 translate-y-6 transition-all duration-700";

            setTimeout(() => {
                // Step 1: Logo Reveal
                const logoContainer = document.getElementById('logoContainer');
                logoContainer.classList.remove('opacity-0', 'scale-75');
                logoContainer.classList.add('opacity-100', 'scale-100');
                playChimeNote(523.25);

                setTimeout(() => {
                    // Step 2: MXM Matrix Decoder Effect
                    document.getElementById('dividerLine').style.opacity = '1';
                    document.getElementById('dividerLine').style.width = '128px';
                    
                    scrambleText('mxmText', 'MXM', 45, () => {
                        playChimeNote(659.25);

                        setTimeout(() => {
                            // Step 3: Princess Alya greeting decoder text
                            scrambleText('subtitleText', 'Hello there princcsess alya (lily of the valley :)', 22, () => {
                                playChimeNote(783.99);
                                playChimeNote(1046.50);

                                // Step 4: Final Button Reveal
                                setTimeout(() => {
                                    const actionBtn = document.getElementById('actionContainer');
                                    actionBtn.classList.remove('opacity-0', 'translate-y-6');
                                    actionBtn.classList.add('opacity-100', 'translate-y-0');
                                }, 350);
                            });
                        }, 350);
                    });
                }, 750);
            }, 450);
        }

        function replayIntro() {
            initAudio();
            runIntroSequence();
        }

        function enterRealm() {
            playChimeNote(880);
            showModal("Welcomeee ik i made u wait alil 💜", "anyways here we go thats the website for the questions i have for you");
        }

        function showModal(title, message) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            const modal = document.getElementById('customModal');
            const box = document.getElementById('modalBoxContent');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            box.classList.remove('scale-95');
            box.classList.add('scale-100');
        }

        function goToQuestions() {
            playChimeNote(1046.50);
            window.location.href = "questions.htm";
        }

        // Run Sequence
        window.onload = function() {
            setTimeout(() => {
                runIntroSequence();
                setTimeout(() => {
                    initAudio();
                    startAmbientHum();
                }, 1000);
            }, 250);
        };
    </script>
</body>
